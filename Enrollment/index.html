<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Enrollment System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Student Enrollment System</h1>
    </header>

    <main>

        <section class="form-container">
            <h2>Enrollment Form</h2>

            <form id="enrollmentForm">

                <fieldset>
                    <legend>Student Information</legend>

                    <label for="studentId">Student ID</label>
                    <input type="text" id="studentId" required>

                    <label for="prefix">Prefix</label>
                    <input type="text" id="prefix">

                    <label for="firstName">First Name</label>
                    <input type="text" id="firstName" required>

                    <label for="middleName">Middle Name</label>
                    <input type="text" id="middleName">

                    <label for="lastName">Last Name</label>
                    <input type="text" id="lastName" required>

                    <label for="suffix">Suffix</label>
                    <input type="text" id="suffix">

                    <label for="email">Email</label>
                    <input type="email" id="email" required>
                </fieldset>

                <fieldset>
                    <legend>Academic Information</legend>

                    <label for="course">Course</label>
                    <select id="course" required>
                        <option value="">Select Course</option>
                        <option value="BSIT">BSIT</option>
                        <option value="BSCS">BSCS</option>
                        <option value="BMMA">BMMA</option>
                        <option value="BSDA">BSDA</option>
                        <option value="BSAIS">BSAIS</option>
                    </select>

                    <fieldset id="majorFieldset" class="hidden">
                        <legend>BSIT Major</legend>

                        <label for="major">Major</label>
                        <select id="major">
                            <option value="">Select Major</option>
                            <option value="Net Sec">Net Sec</option>
                            <option value="Web Tech">Web Tech</option>
                            <option value="ERP">ERP</option>
                        </select>
                    </fieldset>

                    <label for="yearLevel">Year Level</label>
                    <select id="yearLevel" required>
                        <option value="">Select Year Level</option>
                        <option value="1st Year">1st Year</option>
                        <option value="2nd Year">2nd Year</option>
                        <option value="3rd Year">3rd Year</option>
                    </select>

                </fieldset>

                <button type="submit">Submit</button>

            </form>

            <p id="message"></p>

        </section>

        <section class="table-container">
            <h2>Enrolled Students</h2>

            <table>
                <thead>
                    <tr>
                        <th>Student ID</th>
                        <th>Full Name</th>
                        <th>Email</th>
                        <th>Course</th>
                        <th>Major</th>
                        <th>Year Level</th>
                    </tr>
                </thead>

                <tbody id="studentTableBody"></tbody>
            </table>

        </section>

    </main>

</body>

<script src="script.js"></script>
</html>
